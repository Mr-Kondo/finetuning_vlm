[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm-lab"
version = "0.1.0"
description = "Fine-tuning Qwen3-VL-4B-Instruct on CORD v2 via 4-bit QLoRA on Google Colab."
requires-python = ">=3.10"
# Pinned to the exact versions verified working together in this Phase 1 session
# (docs/EXPERIMENT_SPEC.md §7: "Pin dependency package versions"). Bump deliberately,
# re-verify (pytest + both notebooks), and update this comment's date when changed.
dependencies = [
    "datasets==5.0.1",
    # 4.57.0 added Qwen3-VL support but was yanked by PyPI (broken setup);
    # 5.15.0 is the version this project was verified against (AutoConfig /
    # AutoProcessor for Qwen3-VL confirmed working; 4.57.1+ is the known floor
    # if a lower pin is ever needed).
    "transformers==5.15.0",
    "torch==2.13.0",
    "pillow==12.3.0",
    # transformers' AutoProcessor for Qwen3-VL pulls in a video-processor
    # sub-component that hard-requires torchvision, even for image-only use.
    "torchvision==0.28.0",
    # QLoRA needs both halves of the design that were missing from this list:
    # peft supplies LoraConfig / get_peft_model / prepare_model_for_kbit_training,
    # bitsandbytes supplies the NF4 runtime quantization and paged_adamw_8bit.
    "peft==0.20.0",
    "bitsandbytes==0.50.0",
    # transformers.Trainer delegates device placement and the fp16 grad-scaler
    # path (the only usable path on T4, which has no bf16) to accelerate.
    "accelerate==1.14.0",
    # Validates model output against the normative JSON Schema 2020-12 document
    # generated from the train+validation schema inventory.
    "jsonschema==4.26.0",
    # Reads configs/*.yaml, which hold every experiment parameter (AGENTS.md §17).
    "pyyaml==6.0.3",
    # The vendored Donut evaluator computes TED-Acc via zss.distance over the
    # normalized ground-truth tree.
    "zss==1.2.0",
    # Also required by that same evaluator: the official donut/util.py imports
    # nltk.edit_distance directly to compare leaf labels.
    "nltk==3.10.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "nbformat>=5.10",
]

[tool.setuptools.packages.find]
where = ["src"]
