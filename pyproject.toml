[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm-lab"
version = "0.1.0"
description = "Fine-tuning Qwen3-VL-4B-Instruct on CORD v2 via 4-bit QLoRA on Google Colab."
requires-python = ">=3.10"
# Pinned to the exact versions verified working together in this Phase 1 session
# (docs/EXPERIMENT_SPEC.md §7: "Pin dependency package versions"). Bump deliberately,
# re-verify (pytest + both notebooks), and update this comment's date when changed.
dependencies = [
    "datasets==5.0.1",
    # 4.57.0 added Qwen3-VL support but was yanked by PyPI (broken setup);
    # 5.15.0 is the version this project was verified against (AutoConfig /
    # AutoProcessor for Qwen3-VL confirmed working; 4.57.1+ is the known floor
    # if a lower pin is ever needed).
    "transformers==5.15.0",
    "torch==2.13.0",
    "pillow==12.3.0",
    # transformers' AutoProcessor for Qwen3-VL pulls in a video-processor
    # sub-component that hard-requires torchvision, even for image-only use.
    "torchvision==0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "nbformat>=5.10",
]

[tool.setuptools.packages.find]
where = ["src"]
